name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. Pinning one while package.json declares
      # another makes action-setup abort with "Multiple versions of pnpm
      # specified" before a single gate runs, which is what had CI failing on
      # every commit since 2026-07-19. Letting it read `packageManager` keeps
      # the two in sync by construction.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Contentlayer generates `.contentlayer/generated`, which lib/blog.ts,
      # lib/changelog.ts, lib/compare.ts and app/sitemap.ts all import. A fresh
      # checkout has no such directory, so type-check reported 16 phantom errors
      # ("Cannot find module 'contentlayer/generated'") that do not exist on any
      # developer machine. It has to run before the type gate, not just inside
      # the build.
      - name: Generate contentlayer types
        env:
          NODE_ENV: production
        run: pnpm contentlayer build

      # Gate 1 - TypeScript. Mirrors `pnpm type-check` (tsc --noEmit).
      # NOTE: the tree may carry a small set of pre-existing type errors / suppressions
      # (tracked as a baseline to clear). New errors introduced by a change must fail here.
      - name: Type-check
        run: pnpm type-check

      # Gate 2 - Lint (eslint + prettier rules).
      - name: Lint
        run: pnpm lint

      # Gate 3 - Production build (contentlayer build + next build).
      # env.mjs validates env at build time (no SKIP_ENV_VALIDATION wired), so we feed
      # placeholder values. These are NOT real secrets - they only satisfy the schema so the
      # build can run. Real values live in the deployment environment.
      - name: Build
        env:
          NODE_ENV: production
          LLM_API_KEY: ci-placeholder-key
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          NEXT_PUBLIC_GTM_MEASUREMENT_ID: GTM-CIPLACEHOLDER
          NEXT_PUBLIC_POSTHOG_KEY: phc_ci_placeholder
        run: pnpm build
